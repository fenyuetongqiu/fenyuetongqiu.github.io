<style>

    --ink:#eaf1f8; --ink2:#93a4b8; --line:rgba(255,255,255,.09);
    --c1:#59d0ff; --c2:#a78bfa; --c3:#f472b6;

  *{box-sizing:border-box}

  .orb{position:absolute;border-radius:50%;opacity:.55;animation:float 24s ease-in-out infinite}
  .orb.a{width:760px;height:760px;left:-260px;top:-280px;background:radial-gradient(circle,rgba(43,143,216,.55),rgba(43,143,216,0) 62%)}
  .orb.b{width:700px;height:700px;right:-240px;top:-40px;background:radial-gradient(circle,rgba(124,92,240,.5),rgba(124,92,240,0) 62%);animation-delay:-8s}
  .orb.c{width:820px;height:820px;right:6%;bottom:-460px;background:radial-gradient(circle,rgba(208,81,143,.42),rgba(208,81,143,0) 64%);animation-delay:-16s}

  nav a.on{color:#0a1018;background:linear-gradient(135deg,var(--c1),var(--c2));font-weight:600}
  .nbd{display:inline-block;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--c3);color:#08131f;font-size:11px;font-weight:700;line-height:16px}

  .kicker{font-size:11.5px;letter-spacing:2.4px;color:var(--c1);font-weight:600;margin-bottom:8px}
  h2{font-size:clamp(24px,3vw,32px);margin:0;letter-spacing:-.6px}
  .head p{margin:0;color:var(--ink2);font-size:13.5px}

  .cardact{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}

  .notice{display:flex;gap:10px;align-items:center;padding:14px 18px;border-radius:14px;margin:0 0 22px;
    border:1px solid rgba(89,208,255,.28);background:rgba(59,140,220,.12);color:#d3ecff;font-size:14px}
  .notice b{color:var(--c1);font-size:12px;letter-spacing:1.6px;flex:none}

  .field{display:flex;flex-direction:column;gap:7px;margin:0 0 14px}
  .field label{font-size:12.5px;color:var(--ink2)}
  input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:14px;outline:none;transition:.16s}
  input:focus,textarea:focus,select:focus{border-color:rgba(89,208,255,.6);
    box-shadow:0 0 0 3px rgba(89,208,255,.12);background:rgba(255,255,255,.06)}
  textarea{min-height:92px;resize:vertical}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:160px}
  ul.perks{list-style:none;padding:0;margin:8px 0}

  ul.perks li:before{content:'✓';position:absolute;left:2px;top:6px;color:var(--c1);font-weight:700}
  .msg{min-height:20px;font-size:13.5px;color:var(--c1)}
  .msg.err{color:#ffb4b4}

  .panel{padding:24px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
  .panel h3{margin:0 0 16px;font-size:17px}
  .panel+.panel{margin-top:16px}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:14px}
  .kv:last-child{border:0}
  .kv span{color:var(--ink2)}
  .pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .pill.ok{color:#b7f7cd;border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.12)}
  .pill.wait{color:#ffe6b0;border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.12)}
  .pill.cancel{color:#cfcfcf;border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06)}

  .empty{padding:36px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:var(--r)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  @media(max-width:820px){table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.07)}
  th{color:var(--ink2);font-weight:500;font-size:12.5px}

  footer{border-top:1px solid var(--line);padding:30px 22px;text-align:center;color:var(--ink2);font-size:13px}
  .two{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:820px){.two{grid-template-columns:1.15fr .85fr}}
  .quote{font-size:15.5px;line-height:1.9;color:var(--ink);margin:0 0 14px}
  .muted{color:var(--ink2)}
  .tabs{display:flex;gap:8px;margin:0 0 18px}
  .tabs button{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink2);font-size:14px}
  .tabs button.on{color:#08111a;background:linear-gradient(135deg,var(--c1),var(--c2));border-color:transparent;font-weight:600}
  .narrow{max-width:460px;margin:0 auto}
  .pimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;display:block;
    margin:-4px 0 14px;cursor:zoom-in;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .pimg:hover{filter:brightness(1.08)}
  .imgprev{width:100%;max-height:200px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin:10px 0}
  .lightbox.pay{align-items:center;justify-content:center}
  .paycard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:340px;width:calc(100% - 40px);text-align:center;box-shadow:0 30px 80px -30px #000}
  .paycard h3{margin:0 0 6px;font-size:20px}
  .paycard .qrcode{width:220px;height:220px;object-fit:contain;background:#fff;border-radius:12px;margin:10px auto;display:block}
  .paycard .qrbox{width:220px;height:220px;margin:10px auto;border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink2)}
  .paycard .btn{width:100%;margin-top:8px}
  .payprev img.imgprev{max-width:200px}
  .lightbox{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
    background:rgba(3,5,9,.9);padding:24px;cursor:zoom-out;animation:fade .2s ease both}
  .lightbox img{max-width:min(1100px,96vw);max-height:88vh;border-radius:14px;
    box-shadow:0 40px 90px -30px #000}
  @media (max-width:760px){
    html,body{overflow-x:hidden;max-width:100%}
    .bg{overflow:hidden}
    .bar{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"logo . btn" "nav nav nav";
      gap:8px 10px;padding:10px 14px;align-items:center}
    .logo{grid-area:logo;font-size:14px;gap:7px;white-space:nowrap;margin:0}
    .logo small{display:none}
    .nbd{display:inline-block;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--c3);color:#08131f;font-size:11px;font-weight:700;line-height:16px}
    .navbtn{grid-area:btn;justify-self:end;padding:7px 12px;font-size:13px;white-space:nowrap;margin:0}
    #nav{grid-area:nav;width:auto;margin:0;display:flex;gap:4px;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
    #nav::-webkit-scrollbar{display:none}
    #nav a{font-size:13px;padding:6px 10px;white-space:nowrap}
    main{padding:0 14px 70px}
    .hero{padding:44px 0 18px}
    h1{letter-spacing:-.8px;margin:16px 0 14px}
    .sub{font-size:15px;line-height:1.75}
    .stats{grid-template-columns:repeat(2,1fr);gap:10px;margin-top:28px}
    .stat{padding:16px}
    .stat span{font-size:12px}
    .cards{grid-template-columns:1fr;gap:12px}
    .card{padding:18px}
  }
  @media (prefers-reduced-motion:reduce){.orb{animation:none}.fade{animation:none}}
  .bars{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
  .bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .bars .bar i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--c1),var(--c2));opacity:.85}
  .bars .bar span{font-size:10.5px;color:var(--mut);white-space:nowrap}
  input[type="file"]{width:100%;padding:9px 12px;border-radius:12px;border:1px dashed rgba(120,160,220,.35);background:#0c1220;color:#9fb0c6;font-size:13px;cursor:pointer}
  input[type="file"]:hover{border-color:var(--c1)}
  input[type="file"]::file-selector-button{margin-right:12px;border:0;border-radius:9px;padding:8px 16px;background:linear-gradient(135deg,#23D6FF,#4A7BFF);color:#04121c;font-weight:700;font-family:inherit;cursor:pointer}
  input[type="file"]::file-selector-button:hover{filter:brightness(1.08)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
  .chip{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--ink2);font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
  .chip:hover{border-color:var(--c1);color:var(--ink)}
  .chip.on{border-color:var(--c1);color:#04121c;background:linear-gradient(135deg,#23D6FF,#4A7BFF);font-weight:700}
  .vs{margin-top:20px;border:1px solid rgba(90,190,255,.3);border-radius:18px;overflow:hidden;background:linear-gradient(160deg,rgba(35,214,255,.07),rgba(74,123,255,.02))}
  .vsrow{display:grid;grid-template-columns:1.7fr .8fr .9fr;align-items:center;padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
  .vsrow.head{border-top:0;background:rgba(255,255,255,.04);font-weight:700;font-size:13px;color:var(--ink2)}
  .vsrow .f{color:var(--ink2)}
  .vsrow .yes{color:#6ee7a8;font-weight:700;text-align:center}
  .vsrow .no{color:#5b6b82;text-align:center}
  .vsrow .vip{text-align:center;color:#23D6FF;font-weight:700;background:rgba(35,214,255,.07)}
  .pts{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .ptsnum{font-size:34px;font-weight:800;color:#23D6FF;letter-spacing:.5px}
  .payprev{margin:0 0 12px}
  .payprev img{max-width:220px;border-radius:12px;border:1px solid rgba(120,160,220,.25)}
</style>
</head>

<script>
(function () {
  'use strict'
  var API = 'https://1541955020-1l7btqdlx4.ap-shanghai.tencentscf.com'
  var KEY = 'fy-token'
  var ME = null
  var SITE = { products: [], notices: [] }
  var MYORDERS = []
  var ADM = { orders: [], wait: 0 }
  var TAB = 'login'
  var IMG = { newData: null, oldKey: '' }

  function shrink(file, maxW, q, cb) {
    var fr = new FileReader()
    fr.onload = function () {
      var im = new Image()
      im.onload = function () {
        var w = im.width, h = im.height
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW }
        var cv = document.createElement('canvas')
        cv.width = w; cv.height = h
        cv.getContext('2d').drawImage(im, 0, 0, w, h)
        cb(cv.toDataURL('image/jpeg', q))
      }
      im.src = fr.result
    }
    fr.readAsDataURL(file)
  }

  function zoom(src) {
    var d = document.createElement('div')
    d.className = 'lightbox'
    d.innerHTML = '<img src="' + esc(src) + '">'
    d.onclick = function () { d.remove() }
    document.body.appendChild(d)
  }

  var CONTACT = { phone: '15279729913', wechat: '15279729913', qq: '15279729913', mail: '15279729913@163.com' }
  var TEXTS = {}
  function applyText() {
    var t = (SITE && SITE.text) || {}
    TEXTS = t
    if (t.phone) CONTACT.phone = t.phone
    if (t.wechat) CONTACT.wechat = t.wechat
    if (t.qq) CONTACT.qq = t.qq
    if (t.mail) CONTACT.mail = t.mail
  }

  function payModal(order) {
    var d = document.createElement('div')
    d.className = 'lightbox pay'
    var img = SITE.payUrl
      ? '<img class="qrcode" src="' + esc(SITE.payUrl) + '" alt="收款码">'
      : '<div class="qrbox">还没放收款码<br><span class="muted">先微信/QQ 联系 ' + esc(CONTACT.wechat) + '</span></div>'
    d.innerHTML = '<div class="paycard">' +
      '<h3>付款 ' + money(order.price) + '</h3>' +
      '<p class="muted">订单号 ' + esc(order.id) + ' · ' + esc(order.productName) + '</p>' +
      (order.origPrice && order.origPrice > order.price
        ? '<p class="muted">原价 ' + money(order.origPrice) + ' · ' + esc(order.saleLabel || '活动价') + '，省 ' + money(order.origPrice - order.price) + '</p>'
        : '') +
      img +
      '<p class="muted">' + (SITE.payNote ? esc(SITE.payNote) : '扫码付完，把付款截图发我微信，确认后就能下载。') + '</p>' +
      '<p class="muted">付完点下面这个按钮，我就知道是谁付的：</p>' +
      '<button class="btn pri" id="paidTip" type="button">我付好了</button>' +
      '<button class="btn ghost" id="payClose" type="button">关掉</button>' +
      '</div>'
    d.onclick = function (e) { if (e.target === d) d.remove() }
    document.body.appendChild(d)
    $('payClose').onclick = function () { d.remove(); render() }
    $('paidTip').onclick = function () {
      var btn = this
      btn.disabled = true
      btn.textContent = '通知中…'
      call('order/notify', { orderId: order.id }, 'POST').then(function (r) {
        var box = document.createElement('div')
        box.className = 'msg'
        if (r.d && r.d.ok) {
          btn.textContent = '已经通知到了'
          box.textContent = '已经通知给工作室了' + (r.d.mailed === false ? '（邮件没发出去，也可以直接把截图发给微信 ' + CONTACT.wechat + '）' : '') + '，确认后刷新就能下载。'
        } else {
          btn.disabled = false
          btn.textContent = '我付好了'
          box.textContent = (r.d && r.d.error) || '没通知上，直接把截图发给微信 ' + CONTACT.wechat + ' 也行。'
        }
        btn.parentNode.insertBefore(box, btn)
      }).catch(function () {
        btn.disabled = false
        btn.textContent = '我付好了'

    var tk = tok()

    if (body) opt.body = JSON.stringify(body)

      return r.json().catch(function () { return { ok: false, error: '服务器返回怪东西 ' + r.status } })

  function maskAcc(a) {
    a = String(a || '')
    var at = a.indexOf('@')
    if (at < 0) return a
    var n = a.slice(0, at), d = a.slice(at)
    if (n.length <= 3) return n + '***' + d
    return n.slice(0, 3) + '***' + d
  }

  function whoLists(ov) {
    if (!ov) return ''
    var us = ov.userList || []
    var pp = ov.people || []
    var h = '<div class="two" style="margin-top:18px">'
    h += '<div><div class="muted" style="margin-bottom:8px">注册名单（都是谁注册的）</div>'
    h += us.length ? '<table><thead><tr><th>名字</th><th>账号</th><th>身份</th><th>注册</th><th></th></tr></thead><tbody>' + us.map(function (u) {

        : '<button class="btn sm ghost" data-role="admin" data-acct="' + esc(u.account) + '">设管理员</button>'
      return '<tr><td>' + esc(u.name || '—') + vtxt + '</td><td>' + esc(maskAcc(u.account)) + '</td><td>' + (u.role === 'admin' ? '管理员' : '普通') + '</td><td>' + when(u.created) + '</td><td>' + roleBtn + '</td></tr>'

      IMG.newData = ''
      IMG.oldKey = ''
      var box = $('pImgBox'); if (box) box.innerHTML = ''
    }

    var fPkg = $('pPkgFile')
    if (fPkg) fPkg.onchange = function () {
      var f = fPkg.files && fPkg.files[0]
      var box = $('pPkgBox')
      if (!f) return
      if (f.size > 5 * 1024 * 1024) { if (box) box.innerHTML = ''; return say('文件超过 5MB 了', true) }
      if (box) box.innerHTML = '<p class="muted">上传中… ' + Math.round(f.size / 1024) + ' KB</p>'
      var rd = new FileReader()
      rd.onload = function () {
        call('admin/upload', { data: rd.result, name: f.name }, 'POST').then(function (r) {
          if (!r.d.ok) { if (box) box.innerHTML = ''; return say(r.d.error || '传不上去', true) }
          var pf = $('pFile'); if (pf) pf.value = r.d.key
          var pn = $('pFileName'); if (pn) pn.value = f.name
          if (box) box.innerHTML = '<p class="muted">已传好：' + esc(f.name) + '（' + Math.round((r.d.size || f.size) / 1024) + ' KB）· 记得点「保存」</p>'
        }).catch(function () { if (box) box.innerHTML = ''; say('连不上服务器', true) })
      }
      rd.readAsDataURL(f)
    }

    Array.prototype.forEach.call(document.querySelectorAll('[data-role]'), function (b) {
      b.onclick = function () {
        var acct = b.getAttribute('data-acct')
        var role = b.getAttribute('data-role')
        if (!confirm((role === 'admin' ? '设为管理员：' : '取消管理员：') + acct + ' ？')) return
        b.disabled = true
        call('admin/setrole', { account: acct, role: role }, 'POST').then(function (r) {
          b.disabled = false
          if (!r.d.ok) return alert(r.d.error || '改不了')
          loadOverview().then(function () { go('admin') })
        }).catch(function () { b.disabled = false; alert('连不上服务器') })
      }
    })

    var vSave = $('vSave')
    if (vSave) vSave.onclick = function () {
      var g = function (id, def) { var e = $(id); return e ? e.value : def }
      var vcfg = vipCfgView()
      var plans = vcfg.plans.map(function (p2, i) {
        return {
          key: p2.key,
          name: g('vName' + i, p2.name),
          price: Number(g('vPrice' + i, p2.price)) || 0,
          days: Number(g('vDays' + i, p2.days)) || 0,
          note: g('vNote' + i, p2.note),
          salePrice: Number(g('vSalePrice' + i, 0)) || 0
        }
      })
      var perks = String(g('vPerks', '')).split('\n').map(function (x) { return x.trim() }).filter(Boolean)
      var saleKeys = []
      ;[0, 1, 2].forEach(function (i) {
        var cb = $('vSaleKey' + i)
        if (cb && cb.checked) saleKeys.push(cb.getAttribute('data-key'))
      })
      vSave.disabled = true
      call('admin/vipcfg', {
        headline: g('vHead', vcfg.headline),
        perks: perks,
        howto: g('vHowto', vcfg.howto),
        plans: plans,
        sale: {
          on: String(g('vSaleOn', '')) === '1',
          label: g('vSaleLabel', ''),
          percent: Number(g('vSalePct', 0)) || 0,
          until: g('vSaleUntil', ''),
          keys: saleKeys
        }
      }, 'POST').then(function (r) {
        vSave.disabled = false
        if (!r.d || !r.d.ok) return alert((r.d && r.d.error) || '存不上')
        SITE.vip = r.d.vip
        render()
        var box = $('msg4')
        if (box) box.textContent = '存好了，产品页已经更新。'
      }).catch(function () { vSave.disabled = false; alert('连不上服务器') })
    }

    var tSave = $('tSave')
    if (tSave) tSave.onclick = function () {
      var g2 = function (id, def) { var e = $(id); return e ? e.value : def }
      tSave.disabled = true
      call('admin/text', {
        heroTitle: g2('tHero', ''), heroSub: g2('tSub', ''), foot: g2('tFoot', ''),
        phone: g2('tPhone', ''), wechat: g2('tWechat', ''), qq: g2('tQQ', ''), mail: g2('tMail', '')
      }, 'POST').then(function (r) {
        tSave.disabled = false
        if (!r.d || !r.d.ok) return alert((r.d && r.d.error) || '存不上')
        loadSite().then(function () { render(); var b = $('msg5'); if (b) b.textContent = '存好了，全站已经换了。' })
      }).catch(function () { tSave.disabled = false; alert('连不上服务器') })
    }

    var sv = $('pSave')
    if (sv) sv.onclick = function () {
      var body = {
        id: ($('pId') || {}).value || '',
        name: ($('pName') || {}).value || '',
        price: ($('pPrice') || {}).value || 0,
        ver: ($('pVer') || {}).value || '',
        tag: ($('pTag') || {}).value || '',
      cat: ($('pCat') || {}).value || '',
      points: Number(($('pPoints') || {}).value || 0) || 0,
      vipFree: (($('pVipFree') || {}).value || '1') === '1',
        desc: ($('pDesc') || {}).value || '',
        file: ($('pFile') || {}).value || '',
        fileName: ($('pFileName') || {}).value || '',
        img: IMG.newData === '' ? '' : (IMG.newData ? '__upload__' : IMG.oldKey),
        demoUrl: ($('pDemoUrl') || {}).value || '',
        demo: ($('pDemo') || {}).value || '',
      }
      if (!body.name.trim()) return say('产品得有个名字', true)
      sv.disabled = true
      var job = body.img === '__upload__'
        ? call('admin/upload', { data: IMG.newData }, 'POST').then(function (r) {
            if (!r.d.ok) throw new Error(r.d.error || '图片传不上去')
            body.img = r.d.key
          })
        : Promise.resolve()
      job.then(function () { return call('admin/product', body, 'POST') })
        .then(function (r) {
          sv.disabled = false
          if (!r.d.ok) return say(r.d.error || '存不上', true)
          say('存好了')
          IMG = { newData: null, oldKey: '' }
          ;['pId', 'pName', 'pPrice', 'pVer', 'pTag', 'pDesc', 'pFile', 'pFileName', 'pImgFile', 'pDemoUrl', 'pDemo', 'pPoints'].forEach(function (k) { var e = $(k); if (e) e.value = '' })
          var box = $('pImgBox'); if (box) box.innerHTML = ''
          loadSite().then(render)
        }).catch(function (e) { sv.disabled = false; say(e.message || '连不上服务器', true) })
    }

    var pc = $('pClear')
    if (pc) pc.onclick = function () {
      ;['pId', 'pName', 'pPrice', 'pVer', 'pTag', 'pDesc', 'pFile', 'pFileName'].forEach(function (k) { var e = $(k); if (e) e.value = '' })
      say('')
    }

    var ns = $('nSend')
    if (ns) ns.onclick = function () {
      var t = (($('nText') || {}).value || '').trim()
      var box = $('msg2')
      if (!t) return say('公告写点什么', true, box)
      ns.disabled = true
      call('admin/notice', { text: t }, 'POST').then(function (r) {
        ns.disabled = false
        if (!r.d.ok) return say(r.d.error || '发不出去', true, box)
        $('nText').value = ''
        say('公告发出去了', false, box)
        loadSite().then(render)
      }).catch(function () { ns.disabled = false; say('连不上服务器', true, box) })
    }
  }

  function setOrder(id, status) {
    var body = { id: id, status: status }
    if (status === 'paid') {
      var pv = ($('paidVip') || {}).value || ''
      if (pv) body.vipPlan = pv
    }
    call('admin/order/set', body, 'POST').then(function (r) {
      if (!r.d.ok) return alert(r.d.error || '改不了')
      if (r.d.vip) alert('收款确认了，会员也开好了：' + (r.d.vip.text || '') + (r.d.vip.days > 0 ? '（剩 ' + r.d.vip.days + ' 天）' : ''))
      Promise.all([loadAdmin(), loadMine()]).then(render)
    }).catch(function () { alert('连不上服务器') })
  }

  /* ---------- 数据 ---------- */
  function loadSite() {
    return call('site').then(function (r) {
      if (r.d && r.d.ok) SITE = { products: r.d.products || [], notices: r.d.notices || [], allNotices: r.d.allNotices || r.d.notices || [], payUrl: r.d.payUrl || '', payNote: r.d.payNote || '', vip: r.d.vip || null, text: r.d.text || {} }; applyText()
    }).catch(function () {})
  }
  function loadMine() {
    if (!ME) { MYORDERS = []; return Promise.resolve() }
    return call('me/orders').then(function (r) {
      if (r.d && r.d.ok) MYORDERS = r.d.orders || []
    }).catch(function () {})
  }
  function loadAdmin() {
    if (!ME || ME.role !== 'admin') { ADM = { orders: [], wait: 0 }; return Promise.resolve() }
    return call('admin/orders').then(function (r) {
      if (r.d && r.d.ok) ADM = { orders: r.d.orders || [], wait: r.d.wait || 0, stats: r.d.stats || null, overview: ADM.overview }
    }).catch(function () {})
  }

  function reportVisit() {
    try {
      var k = 'fy-visit-' + new Date().toISOString().slice(0, 10)
      if (localStorage.getItem(k)) return
      localStorage.setItem(k, '1')
    } catch (e) {}
    call('visit', {}, 'POST').catch(function () {})
  }

  function loadOverview() {
    if (!ME || ME.role !== 'admin') return Promise.resolve()
    return call('admin/overview').then(function (r) { if (r.d && r.d.ok) ADM.overview = r.d }).catch(function () {})
  }

  function boot() {
    var chain = Promise.resolve()
    if (tok()) {
      chain = call('me').then(function (r) {
        if (r.d && r.d.ok) ME = r.d.user
        else { setTok(''); ME = null }
      }).catch(function () {})
    }
    chain.then(loadSite).then(loadMine).then(loadAdmin).then(loadOverview).then(render)
  }

  var lastHash = ''
  window.addEventListener('hashchange', function () {
    var r = parseHash()
    if (location.hash === lastHash) return
    lastHash = location.hash
    render()
    var jobs = []
    if (r.page === 'me') jobs = [loadMine()]
    else if (r.page === 'admin') jobs = [loadAdmin(), loadSite(), loadOverview()]
    else if (r.page === 'products') jobs = [loadSite(), loadMine()]
    if (!jobs.length) return
    Promise.all(jobs).then(function () {
      if (location.hash === lastHash) render()
    })
  })

  reportVisit()
  boot()
})()
</script>
</body>
</html>
