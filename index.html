<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>风月科技 · FENGYUE TECH</title>
<meta name="description" content="风月科技：把琐碎的日子做成顺手的东西。家庭工具、单文件网页应用、桌面与安卓客户端。">
<meta name="theme-color" content="#05070c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2359d0ff'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23070b12'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#05070c; --card:rgba(255,255,255,.035); --card2:rgba(255,255,255,.06);
    --ink:#eaf1f8; --ink2:#93a4b8; --line:rgba(255,255,255,.09);
    --c1:#59d0ff; --c2:#a78bfa; --c3:#f472b6;
    --r:16px; --maxw:1120px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:15px/1.7 "PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer}
  ::selection{background:rgba(89,208,255,.3)}

  .bg{position:fixed;inset:0;z-index:-3;background:
    radial-gradient(900px 600px at 12% -10%,rgba(89,208,255,.16),transparent 60%),
    radial-gradient(800px 620px at 92% 6%,rgba(167,139,250,.16),transparent 62%),
    radial-gradient(700px 500px at 60% 108%,rgba(244,114,182,.10),transparent 60%),
    linear-gradient(180deg,#05070c,#070a11 40%,#05070c)}
  .grid{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(circle at 50% 28%,#000 20%,transparent 78%);
    -webkit-mask-image:radial-gradient(circle at 50% 28%,#000 20%,transparent 78%)}
  .orb{position:absolute;border-radius:50%;opacity:.55;animation:float 24s ease-in-out infinite}
  .orb.a{width:760px;height:760px;left:-260px;top:-280px;background:radial-gradient(circle,rgba(43,143,216,.55),rgba(43,143,216,0) 62%)}
  .orb.b{width:700px;height:700px;right:-240px;top:-40px;background:radial-gradient(circle,rgba(124,92,240,.5),rgba(124,92,240,0) 62%);animation-delay:-8s}
  .orb.c{width:820px;height:820px;right:6%;bottom:-460px;background:radial-gradient(circle,rgba(208,81,143,.42),rgba(208,81,143,0) 64%);animation-delay:-16s}
  @keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(0,-26px,0) scale(1.03)}}

  header{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
    background:linear-gradient(180deg,rgba(5,7,12,.86),rgba(5,7,12,.55));border-bottom:1px solid var(--line)}
  .bar{max-width:var(--maxw);margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.4px;font-size:16px}
  .logo .mark{width:11px;height:11px;border-radius:50%;
    background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 18px rgba(89,208,255,.75)}
  .logo small{font-weight:500;font-size:10.5px;letter-spacing:2.2px;color:var(--ink2)}
  nav{margin-left:auto;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  nav a{padding:8px 13px;border-radius:999px;font-size:14px;color:var(--ink2);transition:.18s}
  nav a:hover{color:var(--ink);background:rgba(255,255,255,.05)}
  nav a.on{color:#0a1018;background:linear-gradient(135deg,var(--c1),var(--c2));font-weight:600}
  .nbd{display:inline-block;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--c3);color:#08131f;font-size:11px;font-weight:700;line-height:16px}
  .navbtn{padding:8px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.04);color:var(--ink);font-size:14px;transition:.18s}
  .navbtn:hover{background:rgba(255,255,255,.1)}

  main{max-width:var(--maxw);margin:0 auto;padding:0 22px 90px}
  .fade{animation:fade .3s ease both}
  main{contain:layout style}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .hero{padding:74px 0 26px;max-width:820px}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;padding:6px 14px;border-radius:999px;
    border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12.5px;color:var(--ink2)}
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--c1);box-shadow:0 0 10px var(--c1)}
  h1{font-size:clamp(34px,5.6vw,60px);line-height:1.14;letter-spacing:-1.4px;margin:22px 0 20px;font-weight:800}
  h1 em{font-style:normal;background:linear-gradient(100deg,var(--c1),var(--c2) 55%,var(--c3));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{color:var(--ink2);font-size:16px;max-width:620px;margin:0 0 28px}
  .cta{display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;
    border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--ink);
    font-size:14.5px;transition:.2s}
  .btn:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
  .btn.pri{background:linear-gradient(135deg,var(--c1),var(--c2));color:#08111a;border:0;font-weight:700;
    box-shadow:0 14px 34px -16px rgba(89,208,255,.8)}
  .btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
  .btn.ghost{background:none}
  .btn.danger{color:#ffc9c9;border-color:rgba(248,113,113,.4)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:44px 0 0}
  .stat{padding:20px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
  .stat b{display:block;font-size:26px;letter-spacing:-.5px}
  .stat span{font-size:12.5px;color:var(--ink2)}

  section{padding:58px 0 0}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 24px;flex-wrap:wrap}
  .kicker{font-size:11.5px;letter-spacing:2.4px;color:var(--c1);font-weight:600;margin-bottom:8px}
  h2{font-size:clamp(24px,3vw,32px);margin:0;letter-spacing:-.6px}
  .head p{margin:0;color:var(--ink2);font-size:13.5px}

  .cards{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
  .card{padding:22px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);
    transition:.22s;position:relative}
  .card:hover{border-color:rgba(255,255,255,.2);transform:translateY(-2px)}
  .card h3{margin:0 0 8px;font-size:18px;letter-spacing:-.3px}
  .card p{margin:0;color:var(--ink2);font-size:14px}
  .price{font-size:24px;font-weight:800;letter-spacing:-.8px;margin:14px 0 10px;
    background:linear-gradient(96deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
  .tag{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
  .cardact{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}

  .notice{display:flex;gap:10px;align-items:center;padding:14px 18px;border-radius:14px;margin:0 0 22px;
    border:1px solid rgba(89,208,255,.28);background:rgba(59,140,220,.12);color:#d3ecff;font-size:14px}
  .notice b{color:var(--c1);font-size:12px;letter-spacing:1.6px;flex:none}

  .field{display:flex;flex-direction:column;gap:7px;margin:0 0 14px}
  .field label{font-size:12.5px;color:var(--ink2)}
  input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:14px;outline:none;transition:.16s}
  input:focus,textarea:focus,select:focus{border-color:rgba(89,208,255,.6);
    box-shadow:0 0 0 3px rgba(89,208,255,.12);background:rgba(255,255,255,.06)}
  textarea{min-height:92px;resize:vertical}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:160px}
  .msg{min-height:20px;font-size:13.5px;color:var(--c1)}
  .msg.err{color:#ffb4b4}

  .panel{padding:24px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
  .panel h3{margin:0 0 16px;font-size:17px}
  .panel+.panel{margin-top:16px}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:14px}
  .kv:last-child{border:0}
  .kv span{color:var(--ink2)}
  .pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .pill.ok{color:#b7f7cd;border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.12)}
  .pill.wait{color:#ffe6b0;border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.12)}
  .pill.cancel{color:#cfcfcf;border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06)}

  .empty{padding:36px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:var(--r)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.07)}
  th{color:var(--ink2);font-weight:500;font-size:12.5px}

  footer{border-top:1px solid var(--line);padding:30px 22px;text-align:center;color:var(--ink2);font-size:13px}
  .two{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:820px){.two{grid-template-columns:1.15fr .85fr}}
  .quote{font-size:15.5px;line-height:1.9;color:var(--ink);margin:0 0 14px}
  .muted{color:var(--ink2)}
  .tabs{display:flex;gap:8px;margin:0 0 18px}
  .tabs button{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink2);font-size:14px}
  .tabs button.on{color:#08111a;background:linear-gradient(135deg,var(--c1),var(--c2));border-color:transparent;font-weight:600}
  .narrow{max-width:460px;margin:0 auto}
  .pimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;display:block;
    margin:-4px 0 14px;cursor:zoom-in;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .pimg:hover{filter:brightness(1.08)}
  .imgprev{width:100%;max-height:200px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin:10px 0}
  .lightbox.pay{align-items:center;justify-content:center}
  .paycard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:340px;width:calc(100% - 40px);text-align:center;box-shadow:0 30px 80px -30px #000}
  .paycard h3{margin:0 0 6px;font-size:20px}
  .paycard .qrcode{width:220px;height:220px;object-fit:contain;background:#fff;border-radius:12px;margin:10px auto;display:block}
  .paycard .qrbox{width:220px;height:220px;margin:10px auto;border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink2)}
  .paycard .btn{width:100%;margin-top:8px}
  .payprev img.imgprev{max-width:200px}
  .lightbox{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
    background:rgba(3,5,9,.9);padding:24px;cursor:zoom-out;animation:fade .2s ease both}
  .lightbox img{max-width:min(1100px,96vw);max-height:88vh;border-radius:14px;
    box-shadow:0 40px 90px -30px #000}
  @media (max-width:760px){
    html,body{overflow-x:hidden;max-width:100%}
    .bg{overflow:hidden}
    .bar{padding:10px 14px;gap:8px;flex-wrap:wrap}
    .logo{font-size:14px;gap:7px;white-space:nowrap;order:1}
    .logo small{display:none}
    .nbd{display:inline-block;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--c3);color:#08131f;font-size:11px;font-weight:700;line-height:16px}
  .navbtn{padding:7px 12px;font-size:13px;white-space:nowrap;order:2;margin-left:auto}
    #nav{order:3;width:100%;display:flex;gap:4px;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
    #nav::-webkit-scrollbar{display:none}
    #nav a{font-size:13px;padding:6px 10px;white-space:nowrap}
    main{padding:0 14px 70px}
    .hero{padding:44px 0 18px}
    h1{letter-spacing:-.8px;margin:16px 0 14px}
    .sub{font-size:15px;line-height:1.75}
    .stats{grid-template-columns:repeat(2,1fr);gap:10px;margin-top:28px}
    .stat{padding:16px}
    .stat span{font-size:12px}
    .cards{grid-template-columns:1fr;gap:12px}
    .card{padding:18px}
  }
  @media (prefers-reduced-motion:reduce){.orb{animation:none}.fade{animation:none}}
</style>
</head>
<body>
<div class="bg"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div><div class="grid"></div><header>
  <div class="bar">
    <a class="logo" href="#/"><span class="mark"></span>风月科技 <small>FENGYUE</small></a>
    <nav id="nav"></nav>
    <button class="navbtn" id="accBtn" type="button">登录</button>
  </div>
</header>

<main id="app"></main>
<footer>© 2026 风月科技 · fenyuetongqiu.top</footer>

<script>
(function () {
  'use strict'
  var API = 'https://1541955020-1l7btqdlx4.ap-shanghai.tencentscf.com'
  var KEY = 'fy-token'
  var ME = null
  var SITE = { products: [], notices: [] }
  var MYORDERS = []
  var ADM = { orders: [], wait: 0 }
  var TAB = 'login'
  var IMG = { newData: null, oldKey: '' }

  function shrink(file, maxW, q, cb) {
    var fr = new FileReader()
    fr.onload = function () {
      var im = new Image()
      im.onload = function () {
        var w = im.width, h = im.height
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW }
        var cv = document.createElement('canvas')
        cv.width = w; cv.height = h
        cv.getContext('2d').drawImage(im, 0, 0, w, h)
        cb(cv.toDataURL('image/jpeg', q))
      }
      im.src = fr.result
    }
    fr.readAsDataURL(file)
  }

  function zoom(src) {
    var d = document.createElement('div')
    d.className = 'lightbox'
    d.innerHTML = '<img src="' + esc(src) + '">'
    d.onclick = function () { d.remove() }
    document.body.appendChild(d)
  }

  var CONTACT = { phone: '15279729913', wechat: '15279729913', qq: '15279729913', mail: '15279729913@163.com' }

  function payModal(order) {
    var d = document.createElement('div')
    d.className = 'lightbox pay'
    var img = SITE.payUrl
      ? '<img class="qrcode" src="' + esc(SITE.payUrl) + '" alt="收款码">'
      : '<div class="qrbox">还没放收款码<br><span class="muted">先微信/QQ 联系 ' + esc(CONTACT.wechat) + '</span></div>'
    d.innerHTML = '<div class="paycard">' +
      '<h3>付款 ' + money(order.price) + '</h3>' +
      '<p class="muted">订单号 ' + esc(order.id) + ' · ' + esc(order.productName) + '</p>' +
      img +
      '<p class="muted">' + (SITE.payNote ? esc(SITE.payNote) : '扫码付完，把付款截图发我微信，确认后就能下载。') + '</p>' +
      '<p class="muted">付完点下面这个按钮，我就知道是谁付的：</p>' +
      '<button class="btn pri" id="paidTip" type="button">我付好了</button>' +
      '<button class="btn ghost" id="payClose" type="button">关掉</button>' +
      '</div>'
    d.onclick = function (e) { if (e.target === d) d.remove() }
    document.body.appendChild(d)
    $('payClose').onclick = function () { d.remove(); render() }
    $('paidTip').onclick = function () {
      var btn = this
      btn.disabled = true
      btn.textContent = '通知中…'
      call('order/notify', { orderId: order.id }, 'POST').then(function (r) {
        var box = document.createElement('div')
        box.className = 'msg'
        if (r.d && r.d.ok) {
          btn.textContent = '已经通知到了'
          box.textContent = '已经通知给工作室了' + (r.d.mailed === false ? '（邮件没发出去，也可以直接把截图发给微信 ' + CONTACT.wechat + '）' : '') + '，确认后刷新就能下载。'
        } else {
          btn.disabled = false
          btn.textContent = '我付好了'
          box.textContent = (r.d && r.d.error) || '没通知上，直接把截图发给微信 ' + CONTACT.wechat + ' 也行。'
        }
        btn.parentNode.insertBefore(box, btn)
      }).catch(function () {
        btn.disabled = false
        btn.textContent = '我付好了'
        var box = document.createElement('div')
        box.className = 'msg'
        box.textContent = '连不上服务器，把截图发给微信 ' + CONTACT.wechat + ' 也行。'
        btn.parentNode.insertBefore(box, btn)
      })
    }
  }

  function $(id) { return document.getElementById(id) }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  }
  function money(n) { return '¥' + (Number(n) || 0) }
  function tok() { try { return localStorage.getItem(KEY) || '' } catch (e) { return '' } }
  function setTok(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY) } catch (e) {} }
  function when(t) {
    if (!t) return '-'
    var d = new Date(t)
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
      ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2)
  }
  function call(path, body, method) {
    var tk = tok()
    var opt = { method: method || (body ? 'POST' : 'GET'), headers: { 'Content-Type': 'application/json' } }
    if (tk) opt.headers.Authorization = 'Bearer ' + tk
    if (body) opt.body = JSON.stringify(body)
    return fetch(API + '/' + path, opt).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: '服务器返回怪东西 ' + r.status } })
        .then(function (d) { return { status: r.status, d: d } })
    })
  }

  /* ---------- 路由 ---------- */
  function parseHash() {
    var h = (location.hash || '#/').replace(/^#\/?/, '')
    var parts = h.split('/').filter(Boolean)
    return { page: parts[0] || '', arg: parts[1] || '' }
  }
  function go(p) { location.hash = '#/' + p }

  function renderNav(cur) {
    var waitN = (ME && ME.role === 'admin' && ADM && ADM.wait) ? ' <b class="nbd">' + ADM.wait + '</b>' : ''
    var items = [['', '首页'], ['products', '产品'], ['download', '下载'], ['about', '关于'], ['contact', '联系']]
    var h = items.map(function (it) {
      var on = (cur === it[0] || (it[0] === 'products' && cur === 'p')) ? ' class="on"' : ''
      return '<a href="#/' + it[0] + '"' + on + '>' + it[1] + '</a>'
    }).join('')
    if (ME && ME.role === 'admin') h += '<a href="#/admin"' + (cur === 'admin' ? ' class="on"' : '') + '>管理' + waitN + '</a>'
    $('nav').innerHTML = h
    var b = $('accBtn')
    if (ME) { b.textContent = ME.name || '我的'; b.onclick = function () { go('me') } }
    else { b.textContent = '登录'; b.onclick = function () { go('login') } }
  }

  /* ---------- 页面 ---------- */
  function pageHome() {
    return '<div class="hero fade">' +
      '<span class="eyebrow"><i></i>风月の工作室 · 2026</span>' +
      '<h1>你说要什么，<br><em>我们就把它做出来</em>。</h1>' +
      '<p class="sub">风月の工作室。你说要个什么，从想法、写代码、上线到打包成 exe / apk，全在这一间屋子里做完；做完你天天用，不合手就接着改。不接「高大上」，只做能用的东西。</p>' +
      '<div class="cta"><a class="btn pri" href="#/products">看看产品 →</a>' +
      '<a class="btn" href="#/contact">找我们聊聊</a></div>' +
      '<div class="stats">' +

      '<div class="field"><label>给谁（邮箱或名字）</label><input id="gWho" maxlength="60" placeholder="15279729913@163.com 或 风月同秋"></div>' +
      '<div class="field"><label>免费送哪个产品</label><select id="gProd">' + ((SITE.products || []).map(function (p) {
        return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'
      }).join('') || '<option value="">还没产品</option>') + '</select></div>' +
      '<div class="cardact"><button class="btn pri" id="gSend" type="button">免费送他</button>' +
      '<button class="btn" id="vipOn" type="button">开终生 VIP</button>' +
      '<button class="btn ghost" id="vipOff" type="button">关掉 VIP</button></div>' +
      '<p class="muted">终生 VIP = 站里所有产品不花钱直接能下。</p>' +
      '<div class="msg" id="msg4"></div></div>' +
      '<div class="panel"><h3>发公告</h3>' +
      '<div class="field"><label>内容（最近 3 条显示在产品页顶部）</label><textarea id="nText" maxlength="200" placeholder="新品上线，本月 8 折"></textarea></div>' +
      '<button class="btn" id="nSend" type="button">发出去</button>' +
      '<div class="msg" id="msg2"></div></div>' +
      '</div>' +
      '<div class="panel" style="margin-top:16px"><h3>在售 ' + (SITE.products || []).length + ' 个</h3>' +
      ((SITE.products || []).length ? '<table><thead><tr><th>产品</th><th>价格</th><th>标签</th><th>安装包</th><th></th></tr></thead><tbody>' +
        (SITE.products || []).map(function (p) {
          return '<tr><td>' + esc(p.name) + (p.ver ? ' <span class="tag">v' + esc(p.ver) + '</span>' : '') + '</td>' +
            '<td>' + money(p.price) + '</td><td>' + esc(p.tag || '—') + '</td>' +
            '<td>' + (p.file ? '<span class="pill ok">已放</span>' : '<span class="pill cancel">没放</span>') + '</td>' +
            '<td><button class="btn sm" data-edit="' + p.id + '">改</button> ' +
            '<button class="btn sm ghost" data-delp="' + p.id + '">删</button></td></tr>'
        }).join('') + '</tbody></table>' : '<p class="muted">还没上架产品。左边填一个试试。</p>') +
      '</div>' +
      '<div class="panel" style="margin-top:16px"><h3>公告 ' + (SITE.notices || []).length + ' 条</h3>' +
      ((SITE.notices || []).length ? (SITE.notices || []).map(function (n) {
        return '<div class="kv"><span>' + esc(n.text) + '</span><b><button class="btn sm ghost" data-deln="' + n.id + '">删</button></b></div>'
      }).join('') : '<p class="muted">还没发公告。</p>') +
      '</div>' +
      '<div class="panel" style="margin-top:16px"><h3>订单</h3>' +
      (os.length ? '<table><thead><tr><th>谁</th><th>产品</th><th>金额</th><th>状态</th><th>时间</th><th></th></tr></thead><tbody>' +
        os.map(function (o) {
          var pill = o.status === 'paid' ? '<span class="pill ok">已付款</span>'
            : o.status === 'cancel' ? '<span class="pill cancel">已取消</span>'
              : '<span class="pill wait">待确认</span>'
          return '<tr><td>' + esc(o.name || o.email) + '</td><td>' + esc(o.productName) + '</td>' +
            '<td>' + money(o.price) + '</td><td>' + pill + '</td><td>' + when(o.ts) + '</td><td>' +
            (o.status === 'wait'
              ? '<button class="btn sm pri" data-paid="' + o.id + '">确认收款</button> <button class="btn sm ghost" data-cancel="' + o.id + '">取消</button>'
              : '<span class="muted">—</span>') + '</td></tr>'
        }).join('') + '</tbody></table>' : '<p class="muted">还没有订单。</p>') +
      '</div></section>'
  }

  /* ---------- 渲染 ---------- */
  function render() {
    var r = parseHash()
    var cur = r.page
    var html
    if (cur === '') html = pageHome()
    else if (cur === 'products') html = pageProducts()
    else if (cur === 'download') html = pageDownload()
    else if (cur === 'p') html = pageProduct(r.arg)
    else if (cur === 'about') html = pageAbout()
    else if (cur === 'contact') html = pageContact()
    else if (cur === 'login') html = pageLogin()
    else if (cur === 'me') html = pageMe()
    else if (cur === 'admin') html = pageAdmin()
    else html = '<section class="fade" style="padding-top:44px"><div class="empty">这页不存在。<a href="#/" style="color:var(--c1)">回首页</a></div></section>'
    $('app').innerHTML = html
    renderNav(cur)
    var sp = $('statProd'); if (sp) sp.textContent = (SITE.products || []).length
    bind()
    window.scrollTo(0, 0)
  }

  function say(t, err, box) {
    var el = box || $('msg')
    if (!el) return
    el.textContent = t || ''
    el.className = 'msg' + (err ? ' err' : '')
  }

  function bind() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-zoom]'), function (im) {
      im.onclick = function () { zoom(im.getAttribute('data-zoom')) }
    })

    var tabs = document.querySelectorAll('.tabs button')
    Array.prototype.forEach.call(tabs, function (b) {
      b.onclick = function () { TAB = b.getAttribute('data-tab'); render() }
    })

    Array.prototype.forEach.call(document.querySelectorAll('[data-dl]'), function (b) {
      b.onclick = function () {
        if (!ME) { go('login'); return }
        var old = b.textContent
        b.disabled = true; b.textContent = '准备中…'
        call('download?id=' + encodeURIComponent(b.getAttribute('data-dl'))).then(function (r) {
          b.disabled = false; b.textContent = old
          if (!r.d.ok) return alert(r.d.error || '下载不了')
          window.open(r.d.url, '_blank')
        }).catch(function () { b.disabled = false; b.textContent = old; alert('连不上服务器') })
      }
    })

    Array.prototype.forEach.call(document.querySelectorAll('[data-buy]'), function (b) {
      b.onclick = function () {
        if (!ME) { go('login'); return }
        var old = b.textContent
        b.disabled = true; b.textContent = '下单中…'
        call('order/create', { productId: b.getAttribute('data-buy') }).then(function (r) {
          b.disabled = false; b.textContent = old
          if (!r.d.ok) return alert(r.d.error || '下单失败')
          payModal(r.d.order)
          loadMine().then(function () { })
        }).catch(function () { b.disabled = false; b.textContent = old; alert('连不上服务器') })
      }
    })

    Array.prototype.forEach.call(document.querySelectorAll('[data-more]'), function (b) {
      b.onclick = function () { go('p/' + b.getAttribute('data-more')) }
    })

    Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (b) {
      b.onclick = function () {
        var p = (SITE.products || []).filter(function (x) { return x.id === b.getAttribute('data-edit') })[0]
        if (!p) return
        go('admin')
        setTimeout(function () {
          ;[['pId', p.id], ['pName', p.name], ['pPrice', p.price], ['pVer', p.ver], ['pTag', p.tag],
            ['pDesc', p.desc], ['pFile', p.file], ['pFileName', p.fileName], ['pDemoUrl', p.demoUrl], ['pDemo', p.demo]].forEach(function (kv) {
            var e = $(kv[0]); if (e) e.value = kv[1] == null ? '' : kv[1]
          })
          IMG = { newData: null, oldKey: p.img || '' }
          var box = $('pImgBox')
          if (box) box.innerHTML = p.imgUrl ? '<img class="imgprev" src="' + p.imgUrl + '">' : ''
        }, 60)
      }
    })

    Array.prototype.forEach.call(document.querySelectorAll('[data-delp]'), function (b) {
      b.onclick = function () {
        if (!confirm('删掉这个产品？已经买过的人会下不了。')) return
        call('admin/product/del', { id: b.getAttribute('data-delp') }, 'POST').then(function (r) {
          if (!r.d.ok) return alert(r.d.error || '删不掉')
          loadSite().then(render)
        }).catch(function () { alert('连不上服务器') })
      }
    })

    Array.prototype.forEach.call(document.querySelectorAll('[data-deln]'), function (b) {
      b.onclick = function () {
        if (!confirm('撤掉这条公告？')) return
        call('admin/notice/del', { id: b.getAttribute('data-deln') }, 'POST').then(function (r) {
          if (!r.d.ok) return alert(r.d.error || '撤不掉')
          loadSite().then(render)
        }).catch(function () { alert('连不上服务器') })
      }
    })

    var paySave = $('paySave')
    if (paySave) paySave.onclick = function () {
      var f = $('payFile')
      var note = ($('payNote') || {}).value || ''
      var go2 = function (data) {
        paySave.disabled = true
        call('admin/pay', { data: data || '', note: note }, 'POST').then(function (r) {
          paySave.disabled = false
          if (!r.d.ok) return say(r.d.error || '存不上', true, $('msg3'))
          say('存好了', false, $('msg3'))
          loadSite().then(render)
        }).catch(function () { paySave.disabled = false; say('连不上服务器', true, $('msg3')) })
      }
      if (f && f.files && f.files[0]) shrink(f.files[0], 900, 0.85, function (d) { go2(d) })
      else go2('')
    }

    var gSend = $('gSend')
    if (gSend) gSend.onclick = function () {
      var who2 = ($('gWho') || {}).value || ''
      var pid = ($('gProd') || {}).value || ''
      if (!who2.trim()) return say('写个邮箱或名字', true, $('msg4'))
      gSend.disabled = true
      call('admin/grant', { email: who2.trim(), name: who2.trim(), productId: pid }, 'POST').then(function (r) {
        gSend.disabled = false
        if (!r.d.ok) return say(r.d.error || '送不了', true, $('msg4'))
        say('送好了：' + (r.d.note || '已经可以下载了'), false, $('msg4'))
      }).catch(function () { gSend.disabled = false; say('连不上服务器', true, $('msg4')) })
    }

    var vipOn = $('vipOn'), vipOff = $('vipOff')
    function setVip(on) {
      var who2 = ($('gWho') || {}).value || ''
      if (!who2.trim()) return say('写个邮箱或名字', true, $('msg4'))
      call('admin/vip', { email: who2.trim(), name: who2.trim(), on: on }, 'POST').then(function (r) {
        if (!r.d.ok) return say(r.d.error || '改不了', true, $('msg4'))
        say(on ? '开好了：终生 VIP' : 'VIP 关掉了', false, $('msg4'))
      }).catch(function () { say('连不上服务器', true, $('msg4')) })
    }
    if (vipOn) vipOn.onclick = function () { setVip(true) }
    if (vipOff) vipOff.onclick = function () { setVip(false) }

    Array.prototype.forEach.call(document.querySelectorAll('[data-paid]'), function (b) {
      b.onclick = function () { setOrder(b.getAttribute('data-paid'), 'paid') }
    })
    Array.prototype.forEach.call(document.querySelectorAll('[data-cancel]'), function (b) {
      b.onclick = function () { setOrder(b.getAttribute('data-cancel'), 'cancel') }
    })

    var login = $('doLogin')
    if (login) login.onclick = function () {
      var a = (($('fAcct') || {}).value || '').trim()
      var p = ($('fPw') || {}).value || ''
      if (!a) return say('填邮箱或者名字', true)
      if (!p) return say('填一下密码', true)
      login.disabled = true; login.textContent = '登录中…'
      call('login', { email: a, password: p }).then(function (r) {
        login.disabled = false; login.textContent = '登录'
        if (!r.d.ok) return say(r.d.error || '登不进去', true)
        setTok(r.d.token); ME = r.d.user
        Promise.all([loadMine(), loadSite(), loadAdmin()]).then(function () { go('me') })
      }).catch(function () { login.disabled = false; login.textContent = '登录'; say('连不上服务器', true) })
    }

    var reg = $('doReg')
    if (reg) reg.onclick = function () {
      var name = (($('fName') || {}).value || '').trim()
      var mail = (($('fMail') || {}).value || '').trim()
      var code = (($('fCode') || {}).value || '').trim()
      var pw = ($('fPw2') || {}).value || ''
      if (name.length < 2) return say('起个名字，至少 2 个字', true)
      if (!/^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/.test(mail)) return say('邮箱格式不对', true)
      if (code.length !== 6) return say('验证码是 6 位数字', true)
      if (pw.length < 8 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return say('密码至少 8 位，字母加数字', true)
      reg.disabled = true; reg.textContent = '注册中…'
      call('register', { name: name, email: mail, code: code, password: pw }).then(function (r) {
        reg.disabled = false; reg.textContent = '注册并登录'
        if (!r.d.ok) return say(r.d.error || '注册失败', true)
        setTok(r.d.token); ME = r.d.user
        Promise.all([loadMine(), loadSite(), loadAdmin()]).then(function () { go('me') })
      }).catch(function () { reg.disabled = false; reg.textContent = '注册并登录'; say('连不上服务器', true) })
    }

    var sc = $('sendCode')
    if (sc) sc.onclick = function () {
      var mail = (($('fMail') || {}).value || '').trim()
      if (!/^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/.test(mail)) return say('先填邮箱', true)
      sc.disabled = true; sc.textContent = '发送中…'
      call('sendcode', { email: mail }).then(function (r) {
        if (!r.d.ok) { sc.disabled = false; sc.textContent = '发验证码'; return say(r.d.error || '发不出去', true) }
        say('验证码发到 ' + (r.d.hint || mail) + ' 了，收件箱翻不到就看垃圾箱')
        var n = 60
        var t = setInterval(function () {
          n--
          if (n <= 0) { clearInterval(t); sc.disabled = false; sc.textContent = '重新发' }
          else sc.textContent = n + ' 秒'
        }, 1000)
      }).catch(function () { sc.disabled = false; sc.textContent = '发验证码'; say('连不上服务器', true) })
    }

    var dn = $('doName')
    if (dn) dn.onclick = function () {
      var v = (($('nName') || {}).value || '').trim()
      if (v.length < 2) return say('名字至少 2 个字', true)
      dn.disabled = true
      call('me/name', { name: v }).then(function (r) {
        dn.disabled = false
        if (!r.d.ok) return say(r.d.error || '改不了', true)
        ME = r.d.user; say('名字改好了'); renderNav(parseHash().page)
      }).catch(function () { dn.disabled = false; say('连不上服务器', true) })
    }

    var dp = $('doPw')
    if (dp) dp.onclick = function () {
      var o = ($('nOld') || {}).value || ''
      var n = ($('nPw') || {}).value || ''
      if (n.length < 8 || !/[A-Za-z]/.test(n) || !/\d/.test(n)) return say('新密码至少 8 位，字母加数字', true)
      dp.disabled = true
      call('me/password', { old: o, nw: n }).then(function (r) {
        dp.disabled = false
        if (!r.d.ok) return say(r.d.error || '改不了', true)
        var a = $('nOld'), b = $('nPw'); if (a) a.value = ''; if (b) b.value = ''
        say('密码换好了，下次用新的登')
      }).catch(function () { dp.disabled = false; say('连不上服务器', true) })
    }

    var lo = $('doLogout')
    if (lo) lo.onclick = function () {
      call('logout', {}).catch(function () {})
      setTok(''); ME = null; MYORDERS = []; ADM = { orders: [], wait: 0 }; go('')
    }

    var fImg = $('pImgFile')
    if (fImg) fImg.onchange = function () {
      var f = fImg.files && fImg.files[0]
      if (!f) return
      var box = $('pImgBox')
      box.innerHTML = '<p class="muted">压缩中…</p>'
      shrink(f, 1000, 0.72, function (dataUrl) {
        IMG.newData = dataUrl
        box.innerHTML = '<img class="imgprev" src="' + dataUrl + '">'
      })
    }
    var ic = $('pImgClear')
    if (ic) ic.onclick = function () {
      IMG.newData = ''
      IMG.oldKey = ''
      var box = $('pImgBox'); if (box) box.innerHTML = ''
    }

    var sv = $('pSave')
    if (sv) sv.onclick = function () {
      var body = {
        id: ($('pId') || {}).value || '',
        name: ($('pName') || {}).value || '',
        price: ($('pPrice') || {}).value || 0,
        ver: ($('pVer') || {}).value || '',
        tag: ($('pTag') || {}).value || '',
        desc: ($('pDesc') || {}).value || '',
        file: ($('pFile') || {}).value || '',
        fileName: ($('pFileName') || {}).value || '',
        img: IMG.newData === '' ? '' : (IMG.newData ? '__upload__' : IMG.oldKey),
        demoUrl: ($('pDemoUrl') || {}).value || '',
        demo: ($('pDemo') || {}).value || '',
      }
      if (!body.name.trim()) return say('产品得有个名字', true)
      sv.disabled = true
      var job = body.img === '__upload__'
        ? call('admin/upload', { data: IMG.newData }, 'POST').then(function (r) {
            if (!r.d.ok) throw new Error(r.d.error || '图片传不上去')
            body.img = r.d.key
          })
        : Promise.resolve()
      job.then(function () { return call('admin/product', body, 'POST') })
        .then(function (r) {
          sv.disabled = false
          if (!r.d.ok) return say(r.d.error || '存不上', true)
          say('存好了')
          IMG = { newData: null, oldKey: '' }
          ;['pId', 'pName', 'pPrice', 'pVer', 'pTag', 'pDesc', 'pFile', 'pFileName', 'pImgFile', 'pDemoUrl', 'pDemo'].forEach(function (k) { var e = $(k); if (e) e.value = '' })
          var box = $('pImgBox'); if (box) box.innerHTML = ''
          loadSite().then(render)
        }).catch(function (e) { sv.disabled = false; say(e.message || '连不上服务器', true) })
    }

    var pc = $('pClear')
    if (pc) pc.onclick = function () {
      ;['pId', 'pName', 'pPrice', 'pVer', 'pTag', 'pDesc', 'pFile', 'pFileName'].forEach(function (k) { var e = $(k); if (e) e.value = '' })
      say('')
    }

    var ns = $('nSend')
    if (ns) ns.onclick = function () {
      var t = (($('nText') || {}).value || '').trim()
      var box = $('msg2')
      if (!t) return say('公告写点什么', true, box)
      ns.disabled = true
      call('admin/notice', { text: t }, 'POST').then(function (r) {
        ns.disabled = false
        if (!r.d.ok) return say(r.d.error || '发不出去', true, box)
        $('nText').value = ''
        say('公告发出去了', false, box)
        loadSite().then(render)
      }).catch(function () { ns.disabled = false; say('连不上服务器', true, box) })
    }
  }

  function setOrder(id, status) {
    call('admin/order/set', { id: id, status: status }, 'POST').then(function (r) {
      if (!r.d.ok) return alert(r.d.error || '改不了')
      Promise.all([loadAdmin(), loadMine()]).then(render)
    }).catch(function () { alert('连不上服务器') })
  }

  /* ---------- 数据 ---------- */
  function loadSite() {
    return call('site').then(function (r) {
      if (r.d && r.d.ok) SITE = { products: r.d.products || [], notices: r.d.notices || [], allNotices: r.d.allNotices || r.d.notices || [] }
    }).catch(function () {})
  }
  function loadMine() {
    if (!ME) { MYORDERS = []; return Promise.resolve() }
    return call('me/orders').then(function (r) {
      if (r.d && r.d.ok) MYORDERS = r.d.orders || []
    }).catch(function () {})
  }
  function loadAdmin() {
    if (!ME || ME.role !== 'admin') { ADM = { orders: [], wait: 0 }; return Promise.resolve() }
    return call('admin/orders').then(function (r) {
      if (r.d && r.d.ok) ADM = { orders: r.d.orders || [], wait: r.d.wait || 0 }
    }).catch(function () {})
  }

  function boot() {
    var chain = Promise.resolve()
    if (tok()) {
      chain = call('me').then(function (r) {
        if (r.d && r.d.ok) ME = r.d.user
        else { setTok(''); ME = null }
      }).catch(function () {})
    }
    chain.then(loadSite).then(loadMine).then(loadAdmin).then(render)
  }

  var lastHash = ''
  window.addEventListener('hashchange', function () {
    var r = parseHash()
    if (location.hash === lastHash) return
    lastHash = location.hash
    render()
    var jobs = []
    if (r.page === 'me') jobs = [loadMine()]
    else if (r.page === 'admin') jobs = [loadAdmin(), loadSite()]
    else if (r.page === 'products') jobs = [loadSite(), loadMine()]
    if (!jobs.length) return
    Promise.all(jobs).then(function () {
      if (location.hash === lastHash) render()
    })
  })

  boot()
})()
</script>
</body>
</html>
