<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>单位换算 · 风月小工具</title>
<style>
  :root{--bg:#0a1018;--panel:#111a26;--line:#22303f;--ink:#e8f1fa;--ink2:#93a6ba;--c1:#23d6ff}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#12263c,#0a1018 60%);color:var(--ink);font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:34px 18px 70px}
  h1{font-size:26px;margin:0 0 6px}
  .sub{color:var(--ink2);margin:0 0 22px;font-size:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .tab{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer;font:inherit;font-size:13px}
  .tab.on{background:linear-gradient(135deg,#23d6ff,#4a7bff);color:#04121c;font-weight:700;border-color:#23d6ff}
  .grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
  input,select{width:100%;background:#0d1622;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:17px}
  label{font-size:12px;color:var(--ink2);display:block;margin-bottom:6px}
  .eq{font-size:22px;color:var(--ink2);padding-bottom:10px}
  .swap{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit}
  .quick{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
  .quick button{background:#0d1622;border:1px solid var(--line);color:var(--ink2);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
  .quick button:hover{color:#23d6ff;border-color:#23d6ff}
  .res{margin-top:16px;font-size:22px;font-weight:700;color:#23d6ff;word-break:break-all}
  .muted{color:var(--ink2);font-size:13px}
  .foot{margin-top:26px;color:#5b6b82;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>单位换算</h1>
  <p class="sub">长度、重量、面积、体积、数据、时间、温度，改一边另一边自己变。</p>
  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="grid">
      <div><label>从</label><input id="val" type="number" value="1"><select id="from"></select></div>
      <div class="eq">=</div>
      <div><label>到</label><select id="to"></select><input id="outv" readonly style="margin-top:12px;border-color:#23d6ff;color:#23d6ff"></div>
    </div>
    <div class="quick" id="quick"></div>
    <div class="res" id="res"></div>
  </div>
  <p class="foot">风月の工作室 · 换算全在本地算</p>
</div>
<script>
var CATS = {
  '长度': { u: { '米': 1, '千米': 1000, '厘米': 0.01, '毫米': 0.001, '英寸': 0.0254, '英尺': 0.3048, '英里': 1609.344, '里': 500 } },
  '重量': { u: { '千克': 1, '克': 0.001, '吨': 1000, '斤': 0.5, '两': 0.05, '磅': 0.45359237, '盎司': 0.0283495231 } },
  '面积': { u: { '平方米': 1, '平方千米': 1e6, '平方厘米': 1e-4, '亩': 666.6667, '公顷': 10000, '平方英尺': 0.09290304, '平方英里': 2589988.11 } },
  '体积': { u: { '升': 1, '毫升': 0.001, '立方米': 1000, '加仑(美)': 3.785411784, '杯': 0.24 } },
  '数据': { u: { 'MB': 1, 'KB': 0.001, 'GB': 1000, 'TB': 1000000, 'B': 0.000001, 'MiB': 1.048576, 'GiB': 1073.741824 } },
  '时间': { u: { '秒': 1, '分钟': 60, '小时': 3600, '天': 86400, '周': 604800, '年(365)': 31536000 } },
  '温度': { temp: true }
}
var cur = '长度'
function $(id) { return document.getElementById(id) }
function buildTabs() {
  $('tabs').innerHTML = Object.keys(CATS).map(function (k) {
    return '<button class="tab' + (k === cur ? ' on' : '') + '" data-c="' + k + '">' + k + '</button>'
  }).join('')
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
    b.onclick = function () { cur = b.getAttribute('data-c'); buildTabs(); buildUnits(); }
  })
}
function units() {
  if (CATS[cur].temp) return ['摄氏度', '华氏度', '开尔文']
  return Object.keys(CATS[cur].u)
}
function buildUnits() {
  var us = units()
  var f = $('from'), t = $('to')
  f.innerHTML = us.map(function (u) { return '<option>' + u + '</option>' }).join('')
  t.innerHTML = us.map(function (u) { return '<option>' + u + '</option>' }).join('')
  t.selectedIndex = Math.min(1, us.length - 1)
  $('quick').innerHTML = us.map(function (u) { return '<button data-u="' + u + '">1 ' + u + ' →</button>' }).join('')
  Array.prototype.forEach.call(document.querySelectorAll('#quick button'), function (b) {
    b.onclick = function () { $('from').value = b.getAttribute('data-u'); calc() }
  })
  calc()
}
function num(x) { return (Math.round(x * 1e6) / 1e6).toString() }
function calc() {
  var v = parseFloat($('val').value)
  if (isNaN(v)) { $('outv').value = ''; $('res').textContent = ''; return }
  var a = $('from').value, b = $('to').value, r
  if (CATS[cur].temp) {
    var c = a === '摄氏度' ? v : a === '华氏度' ? (v - 32) * 5 / 9 : v - 273.15
    r = b === '摄氏度' ? c : b === '华氏度' ? c * 9 / 5 + 32 : c + 273.15
  } else {
    var u = CATS[cur].u
    r = v * u[a] / u[b]
  }
  $('outv').value = num(r)
  $('res').textContent = v + ' ' + a + ' = ' + num(r) + ' ' + b
}
$('val').oninput = calc
$('from').onchange = calc
$('to').onchange = calc
buildTabs(); buildUnits()
</script>
</body>
</html>
